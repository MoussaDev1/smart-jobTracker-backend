services:
  db:
    image: postgres:15-alpine
    container_name: jobtracker-db
    ports:
      - "5332:5432"
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: jobtracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jobtracker" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
