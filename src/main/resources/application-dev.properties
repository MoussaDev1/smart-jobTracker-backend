#Connexion a la base de donnees en environnement de developpement (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5332/jobtracker
spring.datasource.username=jobtracker
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

#Pour voir les requetes SQL dans la console
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect