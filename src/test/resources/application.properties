# 1. On désactive Flyway pour les tests (trop compliqué à configurer avec H2)
spring.flyway.enabled=false

# 2. On dit à Hibernate : "Crée les tables toi-même d'après les Entités Java"
spring.jpa.hibernate.ddl-auto=create-drop

# 3. Config H2 (Optionnel mais sécurisant pour imiter Postgres)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=